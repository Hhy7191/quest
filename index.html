<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설문 설계 스튜디오</title><style>
:root{--ink:#203331;--green:#176b56;--bg:#f4f5ef;--line:#dce2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,'Noto Sans KR',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 15px;background:white;color:var(--ink)}button:hover{border-color:var(--green)}.primary{background:var(--green);color:white;border-color:var(--green)}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:19px}.brand span{color:var(--green)}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:235px 1fr;gap:36px;padding:32px 4%}aside nav{display:grid;gap:7px;position:sticky;top:25px}nav button{text-align:left;background:transparent;border:0;padding:13px}nav button.active{background:#deebe1;color:#14533f;font-weight:750}.small{font-size:12px;color:#667770}h1{font-size:36px;letter-spacing:-1.5px;margin:8px 0}h2{font-size:23px;margin:0 0 10px}h3{font-size:17px;margin:0 0 12px}p{margin:6px 0 20px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:2px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;margin:18px 0}.hint{padding:15px 18px;border-radius:10px;background:#eaf1e8;margin:16px 0;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #ccd5cc;border-radius:8px;background:#fcfdfb;padding:11px;color:var(--ink)}textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tag{font-size:12px;border-radius:20px;background:#edf2e9;padding:4px 10px}.rowhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:5px;background:#dce3d9;border-radius:5px;margin:13px 0}.progress i{height:100%;display:block;background:var(--green);border-radius:5px}.steps{display:flex;justify-content:space-between;margin-top:25px}.empty{color:#78847e;border:1px dashed var(--line);padding:25px;text-align:center;border-radius:12px}.warn{background:#fff5df;padding:12px;border-radius:8px;margin:8px 0}.ok{color:var(--green)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.scroll{overflow:auto}a{color:var(--green)}.previewq{padding:18px 0;border-bottom:1px solid var(--line)}.radios{display:flex;gap:15px;flex-wrap:wrap}.radios label{font-weight:400}.radios input{width:auto}footer{color:#718078;font-size:12px;margin:30px 0}@media(max-width:800px){.layout{display:block;padding:20px}aside nav{display:flex;overflow:auto;position:static;margin-bottom:22px}nav button{white-space:nowrap;font-size:12px;padding:9px}.grid{grid-template-columns:1fr}header{flex-wrap:wrap}h1{font-size:28px}.card{padding:19px}}@media print{header,aside,.actions,.steps,footer,button{display:none!important}.layout{display:block;padding:0}.card{break-inside:avoid;border:0;padding:8px}body{background:white}input,textarea,select{border:0}h1{font-size:24px}}

</style><header><div class="brand">▧ <span>설문</span> 설계 스튜디오</div><div class="actions" style="margin:0"><button onclick="example()">예시 불러오기</button><button onclick="backup()">설계 저장</button><button onclick="document.getElementById('import').click()">불러오기</button><input id="import" type="file" accept="application/json" hidden onchange="restore(this)"></div></header><div class="layout"><aside><nav id="nav"></nav><div class="small" style="margin-top:25px">문항보다 먼저, 설계의 근거부터.<br>입력은 이 브라우저에 자동 저장됩니다.<div class="progress"><i id="bar"></i></div><span id="status"></span></div></aside><main><div class="eyebrow">RESEARCH TO QUESTIONS</div><h1 id="heading"></h1><p id="intro"></p><div id="app"></div><div class="steps"><button onclick="go(step-1)">← 이전</button><button class="primary" onclick="go(step+1)">다음 단계 →</button></div><footer>첨부 「설문지 제작」의 설계 흐름을 바탕으로 구성했습니다. 예시는 교육용 초안입니다. 논문 검색·통계 분석을 자동 수행하지 않습니다.</footer></main></div><script>
const titles=['연구의 출발점','변인과 조작적 정의','선행연구·도구 검토','설문 문항 만들기','평가·분석 계획','배포 전 점검','설문지·설계표'];const desc=['누구에게 무엇을 알아볼지 정하고, 설문이 필요한 이유를 적어 보세요.','추상적인 개념을 관찰하고 응답할 수 있는 구체적인 내용으로 바꿉니다.','실제 논문과 원척도를 읽고, 내 연구에 사용할 근거를 기록합니다.','각 문항을 연구문제, 변인, 내용 요소, 출처에 연결합니다.','응답 방식과 수집 시점, 점수 산출과 분석 방법을 함께 계획합니다.','빠진 연결을 확인하고, 대상자의 이해도와 측정의 적합성을 검토합니다.','응답자용 설문지와 연구자용 설계 근거를 확인하고 내보냅니다.'];let step=0;const blank=()=>({title:'',rq:'',target:'',purpose:'',consent:'이 설문은 연구를 위한 것으로 참여는 자발적이며, 원하지 않는 질문은 건너뛰거나 참여를 중단할 수 있습니다.',vars:[],refs:[],qs:[],timing:'',analysis:'',pilot:'',validity:'',reliability:'',privacy:'',checks:{}});let d;try{d=JSON.parse(localStorage.getItem('survey-studio-v1'))||blank()}catch{d=blank()}const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('survey-studio-v1',JSON.stringify(d));document.getElementById('status').textContent='자동 저장됨 · '+d.qs.length+'개 문항'}catch{document.getElementById('status').textContent='자동 저장 실패 · 설계 저장으로 내려받으세요'}}function field(key,label,help='',area=true,obj=d){return `<label>${label}</label>${area?`<textarea oninput="update('${key}',this.value)" placeholder="${esc(help)}">${esc(obj[key])}</textarea>`:`<input oninput="update('${key}',this.value)" placeholder="${esc(help)}" value="${esc(obj[key])}">`}`}function update(k,v){d[k]=v;save()}function sub(type,id,k,v){d[type].find(x=>x.id===id)[k]=v;save()}function sf(type,o,k,label,ph=''){return `<label>${label}</label><textarea placeholder="${esc(ph)}" oninput="sub('${type}','${o.id}','${k}',this.value)">${esc(o[k])}</textarea>`}function sel(type,o,k,label,arr){return `<label>${label}</label><select onchange="sub('${type}','${o.id}','${k}',this.value);render()">${arr.map(([v,l])=>`<option value="${esc(v)}" ${o[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`}function remove(t,id){d[t]=d[t].filter(x=>x.id!==id);save();render()}function add(t){d[t].push(t==='vars'?{id:uid(),name:'',role:'측정 대상',concept:'',elements:'',op:'',score:''}:t==='refs'?{id:uid(),citation:'',url:'',tool:'',sample:'',evidence:'',original:'',change:'',permission:'',read:false}:{id:uid(),text:'',variable:'',element:'',source:'',format:'5점 동의',time:'사후',note:''});save();render()}function go(n){step=Math.max(0,Math.min(6,n));render();window.scrollTo(0,0)}
function render(){document.getElementById('heading').textContent=titles[step];document.getElementById('intro').textContent=desc[step];document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${step===i?'active':''}" onclick="go(${i})">0${i+1}　${t}</button>`).join('');document.getElementById('bar').style.width=((step+1)/7*100)+'%';let h='';if(step===0)h=`<div class="card"><h2>무엇을, 누구에게 알아보나요?</h2>${field('title','연구·프로그램 제목','예: 질문 중심 미술관 교육과 질문 자신감',false)}${field('rq','연구문제','연구문제가 여러 개라면 줄을 나누어 적으세요.') }<div class="grid">${field('target','응답 대상·표집 계획','연령, 경험, 예상 인원, 선정 방식')}${field('purpose','알아볼 내용과 활용 목적','요구 / 운영 경험 / 학습결과를 구분하세요.')}</div></div><div class="hint">설문만으로 확인하기 어려운 실제 수행은 관찰·면담·작품·활동 기록으로 보완하세요.</div>`;
if(step===1)h=`<div class="hint">개념적 정의 → 하위 요소 → 조작적 정의 → 문항과 점수. 독립·종속 변인은 연구 설계상 역할이며 모든 연구에 필수인 구분은 아닙니다.</div>`+d.vars.map(o=>`<div class="card"><div class="rowhead"><h3>변인 ${esc(o.name||'이름을 입력하세요')}</h3><button onclick="remove('vars','${o.id}')">삭제</button></div><div class="grid">${sf('vars',o,'name','변인·평가 영역')}${sel('vars',o,'role','연구에서의 역할',[['측정 대상','측정 대상'],['독립변인','독립변인'],['종속변인','종속변인'],['통제·배경변인','통제·배경변인']])}${sf('vars',o,'concept','개념적 정의','무엇을 뜻하는가? 이론적 근거도 기록')}${sf('vars',o,'elements','살펴볼 내용 요소','한 줄에 하나: 질문 생성, 다양한 질문, 질문 표현')}${sf('vars',o,'op','조작적 정의','누구에게, 언제, 무엇으로 어떻게 측정하는가?')}${sf('vars',o,'score','점수 산출·해석','합계/평균, 범위, 높은 점수의 의미, 결측·역문항 처리')}</div></div>`).join('')+`<button class="primary" onclick="add('vars')">+ 변인 추가</button>`;
if(step===2)h=`<div class="hint">검색어 예시: ‘변인명 + 척도 개발’, ‘변인명 + 타당화’, ‘construct + scale validation’. 검색 결과의 요약만 보지 말고 실제 문항·부록·평가 방법을 확인하세요.</div><div class="actions"><a href="https://www.riss.kr/" target="_blank" rel="noopener">RISS ↗</a><a href="https://www.kci.go.kr/" target="_blank" rel="noopener">KCI ↗</a><a href="https://scholar.google.com/" target="_blank" rel="noopener">Google Scholar ↗</a></div>`+d.refs.map(o=>`<div class="card"><div class="rowhead"><h3>문헌·측정도구</h3><button onclick="remove('refs','${o.id}')">삭제</button></div><div class="grid">${sf('refs',o,'citation','서지정보','저자, 연도, 제목, 학술지/발행처, 쪽수')}${sf('refs',o,'url','원문 URL·DOI')}${sf('refs',o,'tool','척도명·측정 개념·하위 요인')}${sf('refs',o,'sample','원 연구의 대상·표본·언어')}${sf('refs',o,'original','원문 문항·쪽수·응답 척도','직접 확인한 문항과 위치를 기록')}${sf('refs',o,'evidence','평가 방법·신뢰도·타당도 근거','측정시점, 분석방법, 표본과 계수의 맥락')}${sf('refs',o,'change','사용 방식·수정 이유','기존 사용 / 수정·번안 / 새 문항 개발')}${sf('refs',o,'permission','사용·번안 허가·저작권 조건')}</div><label><input type="checkbox" style="width:auto" ${o.read?'checked':''} onchange="sub('refs','${o.id}','read',this.checked)"> 실제 원문을 직접 확인했습니다</label></div>`).join('')+`<button class="primary" onclick="add('refs')">+ 선행연구 기록</button><div class="small">미확인 문헌이나 계수는 자동으로 생성하지 않습니다. 원문 미확인 시 재인용 여부를 명시하세요.</div>`;
if(step===3)h=`<div class="hint">한 문항에 한 가지를, 대상자가 경험한 언어로 묻습니다. ‘쉽고 재미있었다’는 분리하고, 의향과 실제 행동은 구분하세요.</div>`+d.qs.map((o,i)=>`<div class="card"><div class="rowhead"><h3>문항 ${i+1}</h3><button onclick="remove('qs','${o.id}')">삭제</button></div>${sf('qs',o,'text','응답자에게 제시할 질문')}<div class="grid">${sel('qs',o,'variable','연결할 변인',[['','선택하세요'],...d.vars.map(v=>[v.id,v.name||'이름 없는 변인'])])}${sf('qs',o,'element','측정할 내용 요소','변인의 하위 요소 중 무엇인가요?')}${sel('qs',o,'source','출처·근거',[['','선택하세요'],['new','연구자가 개발한 문항'],...d.refs.map(r=>[r.id,r.citation||'서지정보 미입력'])])}${sel('qs',o,'format','응답 방식',[['5점 동의','5점 동의'],['4점 동의','4점 동의'],['5점 만족','5점 만족'],['횟수·수치','횟수·수치'],['서술형','서술형'],['단일 선택','단일 선택']])}${sel('qs',o,'time','측정 시점',[['사전·사후','사전·사후'],['사전','사전'],['사후','사후'],['추후','추후']])}${sf('qs',o,'note','문항 근거·수정 이유·선택지','직접 개발한 이유, 선택형의 보기(한 줄에 하나), 수치 단위·기간')}</div></div>`).join('')+`<button class="primary" onclick="add('qs')">+ 문항 추가</button>`;
if(step===4)h=`<div class="card"><h2>자료가 모이기 전에 정할 것</h2>${field('timing','수집 시점·절차','사전/사후/추후, 같은 사람의 응답을 연결할 익명 코드')}${field('analysis','연구문제별 분석 계획','현황: 빈도·비율 / 전후: 짝지은 비교 / 관계: 상관. 척도·분포·가정을 확인하세요.')}<div class="hint">개별 리커트형 문항은 순서형입니다. 합산·평균은 척도의 구성과 분석 가정을 확인해 결정합니다. 서로 다른 영역을 모두 더해 하나의 ‘교육 효과’로 해석하지 마세요.</div><div class="grid">${field('validity','타당도 검토 계획','내용 요소의 대표성, 전문가 검토, 필요 시 구조·관련성 분석')}${field('reliability','신뢰도 검토 계획','척도에 적합한 α·ω, 재검사 등. 현재 표본에서 확인할 근거')}</div>${field('pilot','예비조사 계획','대상자에게 문항을 자기 말로 설명하게 하기, 어려운 표현·소요시간·수정 기록')}${field('privacy','익명성·개인정보·보관 계획','수집 항목, 이용 목적, 보관기간·폐기, 문의처')}${field('consent','응답자 안내문','자발성·중단 가능성 및 연구 안내')}</div><div class="hint">단일 집단의 사전·사후 차이나 상관관계만으로 인과를 단정할 수 없습니다. 설문 자기평가와 실제 수행 자료를 함께 살펴보세요.</div>`;
if(step===5){let issues=audit();h=`<div class="card"><h2>설계 연결 점검</h2><p>자동 점검은 입력 누락을 찾습니다. 내용의 타당성을 판정하지 않습니다.</p>${issues.length?issues.map(x=>`<div class="warn">${esc(x)}</div>`).join(''):'<p class="ok">필수 연결 정보가 입력되어 있습니다. 아래 내용 검토를 진행하세요.</p>'}</div><div class="card"><h3>내용 검토 체크리스트</h3>${['각 연구문제에 대응하는 변인과 문항이 있는가?','조작적 정의에 내용 요소·측정 방법·점수 해석이 포함되는가?','선행연구의 원문·대상·실제 문항과 평가 방법을 확인했는가?','문항이 쉽고 중립적이며 한 가지 내용만 묻는가?','의향·자기평가와 실제 행동·수행을 구분했는가?','예비조사와 현재 대상의 신뢰도·타당도 검토를 계획했는가?','자발적 참여·개인정보 처리·응답 중단을 안내했는가?'].map((x,i)=>`<label style="font-weight:400"><input type="checkbox" style="width:auto" ${d.checks[i]?'checked':''} onchange="d.checks[${i}]=this.checked;save()"> ${x}</label>`).join('')}</div>`}
if(step===6)h=`<div class="actions"><button class="primary" onclick="downloadSurvey()">설문·설계표 내려받기 (.html)</button><button onclick="csv()">문항 설계표 (.csv)</button><button onclick="window.print()">인쇄 / PDF 저장</button></div>${report()}`;document.getElementById('app').innerHTML=h;save()}
function audit(){let a=[];if(!d.rq)a.push('연구문제를 입력하세요.');if(!d.target)a.push('응답 대상을 입력하세요.');if(!d.vars.length)a.push('변인과 조작적 정의를 추가하세요.');d.vars.forEach(v=>{if(!v.elements||!v.op||!v.score)a.push(`${v.name||'이름 없는 변인'}: 내용 요소·조작적 정의·점수 산출을 확인하세요.`);if(!d.qs.some(q=>q.variable===v.id))a.push(`${v.name||'이름 없는 변인'}에 연결된 문항이 없습니다.`)});if(!d.qs.length)a.push('설문 문항을 추가하세요.');d.qs.forEach((q,i)=>{if(!q.text||!d.vars.some(v=>v.id===q.variable)||!q.element||!q.source||(q.source!=='new'&&!d.refs.some(r=>r.id===q.source)))a.push(`문항 ${i+1}: 문항·변인·내용 요소·출처 연결을 확인하세요.`)});d.refs.forEach(r=>{if(!r.read)a.push(`${r.citation||'기록한 문헌'}: 원문 확인이 필요합니다.`)});if(!d.refs.length)a.push('선행연구·측정도구 검토 기록이 없습니다.');if(!d.analysis||!d.pilot)a.push('분석 계획과 예비조사 계획을 작성하세요.');return a}
function answers(q){let labels=q.format==='5점 동의'?['전혀 그렇지 않다','그렇지 않다','보통이다','그렇다','매우 그렇다']:q.format==='4점 동의'?['전혀 그렇지 않다','그렇지 않다','그렇다','매우 그렇다']:q.format==='5점 만족'?['매우 불만족','불만족','보통','만족','매우 만족']:q.format==='단일 선택'?q.note.split('\n').filter(Boolean):null;if(labels)return `<div class="radios">${labels.map((l,i)=>`<label><input type="radio" name="q${q.id}"> ${i+1}. ${esc(l)}</label>`).join('')}<label><input type="radio" name="q${q.id}"> 해당 없음·판단 어려움</label></div>`;return q.format==='서술형'?'<textarea placeholder="자유롭게 적어 주세요"></textarea>':'<input type="number" placeholder="수치를 입력하세요">'}
function report(){return `<div class="card"><span class="tag">응답자용 · 미리보기 / 응답은 수집되지 않습니다</span><h2 style="margin-top:15px">${esc(d.title||'설문지 제목')}</h2><p style="white-space:pre-wrap">${esc(d.consent)}</p>${d.qs.map((q,i)=>`<div class="previewq"><span class="small">${esc(q.time)}</span><h3>${i+1}. ${esc(q.text||'문항 미입력')}</h3>${answers(q)}</div>`).join('')}</div><div class="card"><h2>연구자용 설계 근거</h2><p><b>연구문제</b><br>${esc(d.rq)}</p><p><b>대상</b> ${esc(d.target)}</p><div class="scroll"><table><tr><th>변인</th><th>내용 요소</th><th>조작적 정의</th><th>점수·해석</th></tr>${d.vars.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.elements)}</td><td>${esc(v.op)}</td><td>${esc(v.score)}</td></tr>`).join('')}</table><table><tr><th>문항</th><th>변인·요소</th><th>응답·시점</th><th>출처·수정 근거</th></tr>${d.qs.map((q,i)=>`<tr><td>${i+1}. ${esc(q.text)}</td><td>${esc(d.vars.find(v=>v.id===q.variable)?.name||'미연결')} / ${esc(q.element)}</td><td>${esc(q.format)} / ${esc(q.time)}</td><td>${esc(q.source==='new'?'연구자 개발':d.refs.find(r=>r.id===q.source)?.citation||'미연결')}<br>${esc(q.note)}</td></tr>`).join('')}</table></div>${['timing','analysis','validity','reliability','pilot','privacy'].map((k,i)=>`<p style="white-space:pre-wrap"><b>${['수집 절차','분석 계획','타당도','신뢰도','예비조사','개인정보'][i]}</b><br>${esc(d[k])}</p>`).join('')}<h3>검토 문헌</h3>${d.refs.map(r=>`<p>${esc(r.citation)}<br>${esc(r.url)}<br>도구: ${esc(r.tool)}<br>대상: ${esc(r.sample)}<br>평가 근거: ${esc(r.evidence)}<br>수정·허가: ${esc(r.change)} / ${esc(r.permission)}<br>원문 확인: ${r.read?'완료':'미확인'}</p>`).join('')}<h3>남은 점검</h3>${audit().map(x=>`<p>· ${esc(x)}</p>`).join('')||'입력 누락 없음 · 내용 검토 필요'}</div>`}
function dl(text,name,type){let u=URL.createObjectURL(new Blob(['\ufeff',text],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){dl(JSON.stringify(d,null,2),'survey-design.json','application/json')}async function restore(el){try{const x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.vars)||!Array.isArray(x.qs)||!Array.isArray(x.refs)||!x.checks)throw Error();if(!confirm('현재 설계를 불러온 파일로 바꿀까요?'))return;d=x;save();render()}catch{alert('설계 저장으로 내려받은 JSON 파일인지 확인해 주세요.')}el.value=''}function downloadSurvey(){dl('<!doctype html><html lang="ko"><meta charset="utf-8"><title>설문 설계</title><style>'+document.querySelector('style').textContent+'</style><main style="max-width:1000px;margin:auto;padding:25px">'+report()+'</main></html>','survey-and-design.html','text/html')}function csv(){const rows=[['번호','문항','변인','내용 요소','응답 방식','시점','출처','근거·수정'],...d.qs.map((q,i)=>[i+1,q.text,d.vars.find(v=>v.id===q.variable)?.name||'',q.element,q.format,q.time,q.source==='new'?'연구자 개발':d.refs.find(r=>r.id===q.source)?.citation||'',q.note])];dl(rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'survey-items.csv','text/csv')}
function example(){if(!confirm('현재 입력을 교육용 예시로 바꿀까요? 먼저 설계 저장을 권장합니다.'))return;d=blank();d.title='질문 중심 미술관 교육: 질문 자신감';d.rq='프로그램 참여 전후 관람자의 질문 자신감은 어떻게 달라지는가?';d.target='성인 초보 관람자, 참여자 표집 계획 별도 수립';d.purpose='질문 생성·표현에 대한 자기평가 변화 살펴보기';d.vars=[{id:'v1',name:'질문 자신감',role:'종속변인',concept:'작품에 관해 스스로 질문을 만들고 표현할 수 있다는 믿음',elements:'질문 생성\n다양한 질문 떠올리기\n질문 표현',op:'사전·사후 동일한 3개 문항의 5점 동의 응답 평균으로 측정',score:'1~5점, 높을수록 자신감이 높음. 결측 처리 기준은 적용 전에 정함. 예시 척도의 구조와 적합성 검토 필요'}];d.qs=['작품을 보며 궁금한 점을 질문으로 만들 수 있다.','한 작품을 보고 서로 다른 질문을 떠올릴 수 있다.','내가 만든 질문을 말이나 글로 분명하게 표현할 수 있다.'].map((text,i)=>({id:uid(),text,variable:'v1',element:d.vars[0].elements.split('\n')[i],source:'new',format:'5점 동의',time:'사전·사후',note:'첨부 PPT의 교육용 예시. 검증된 표준 척도 아님. 관련 원척도 탐색과 대상별 검토 필요.'}));d.analysis='동일 응답자의 사전·사후 자료 연결. 분포와 척도 구성을 확인한 후 대응표본 t검정 또는 Wilcoxon 부호순위 검정 등 검토. 인과 추론의 한계 명시.';d.pilot='대상자에게 문항을 자기 말로 설명하게 하고, 낯선 표현과 응답 시간을 확인해 수정한다.';save();go(0)}render();
</script></html>
